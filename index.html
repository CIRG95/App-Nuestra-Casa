<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nuestra Casa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FB;--surf:#FFFFFF;--surf2:#EEEBF8;--ink:#1E1B3A;--muted:#5B5774;--line:#E2DFF0;
  --pri:#2E4BD8;--pri-ink:#FFFFFF;--warn:#7A5300;--warn-bg:#FFF1BF;--ok:#17704A;--ok-bg:#D4F3E3;--bad:#A3301B;--bad-bg:#FFE2DC;
  --p1:#2E4BD8;--p2:#7A3FD1;--r:22px;
  --m1:#2E4BD8;--m1-ink:#FFFFFF;--m2:#FF9A52;--m2-ink:#2A1606;--m3:#FFD84D;--m3-ink:#2A2206;--sombra:rgba(30,27,58,.18);
  --t0:#FFE1CF;--t1:#FFF1B8;--t2:#D6E4FF;--t3:#D9F5E8;--t4:#F3DDFB;--t5:#FFD9E2;--t6:#DDF3C9;--t7:#E3E1F2;
  font-family:'Fredoka','Trebuchet MS',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16142A;--surf:#211E38;--surf2:#2A2745;--ink:#EEECFA;--muted:#A9A5C4;--line:#36325A;
  --pri:#8195FF;--pri-ink:#0E1030;--warn:#FFD36B;--warn-bg:#3B3216;--ok:#74DDA6;--ok-bg:#1B3F31;--bad:#FF907A;--bad-bg:#45211B;
  --p1:#8DA0FF;--p2:#CDA6FF;
  --m1:#4C64EE;--m1-ink:#FFFFFF;--m2:#FF9A52;--m2-ink:#2A1606;--m3:#FFD84D;--m3-ink:#2A2206;--sombra:rgba(0,0,0,.45);
  --t0:#4A2C20;--t1:#463D16;--t2:#22305A;--t3:#1C4034;--t4:#3E2550;--t5:#4C2230;--t6:#2C4220;--t7:#2E2B48;
}}
:root[data-theme="dark"]{
  --bg:#16142A;--surf:#211E38;--surf2:#2A2745;--ink:#EEECFA;--muted:#A9A5C4;--line:#36325A;
  --pri:#8195FF;--pri-ink:#0E1030;--warn:#FFD36B;--warn-bg:#3B3216;--ok:#74DDA6;--ok-bg:#1B3F31;--bad:#FF907A;--bad-bg:#45211B;
  --p1:#8DA0FF;--p2:#CDA6FF;
  --m1:#4C64EE;--m1-ink:#FFFFFF;--m2:#FF9A52;--m2-ink:#2A1606;--m3:#FFD84D;--m3-ink:#2A2206;--sombra:rgba(0,0,0,.45);
  --t0:#4A2C20;--t1:#463D16;--t2:#22305A;--t3:#1C4034;--t4:#3E2550;--t5:#4C2230;--t6:#2C4220;--t7:#2E2B48;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100dvh;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.bar-top{display:flex;align-items:center;gap:6px;padding:10px 12px 6px 16px;max-width:720px;margin:0 auto}
.brand{font-weight:800;font-size:1.1rem;letter-spacing:-.01em;flex:1}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 8px;border-radius:8px}
.sync::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--muted)}
.s-nube::before{background:var(--pri)}
.s-offline::before,.s-conectando::before{background:var(--warn)}
.s-error::before,.s-sin-sesion::before{background:var(--bad)}
.icon-btn{background:none;border:0;padding:8px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none;max-width:720px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 12px;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding:4px 16px 32px;max-width:720px;margin:0 auto}
.hero{padding:6px 2px 14px}
.hero p{margin:0;color:var(--muted)}
.hero h1{margin:2px 0 0;font-size:clamp(2.1rem,10vw,3rem);line-height:1;font-weight:800;letter-spacing:-.035em}
.hero h1::first-letter{text-transform:uppercase}
.esp-h{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.esp-h span{font-size:2.4rem;line-height:1}
.esp-h h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.03em}
.back{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--muted);padding:6px 4px 6px 0;font-size:.9rem}

h2.sec{font-size:1rem;font-weight:700;margin:22px 2px 8px;display:flex;align-items:center;gap:8px;min-height:32px}
h2.sec .n{color:var(--muted);font-weight:400}
h2.sec .add{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--pri);background:none;border:0;padding:6px 4px}
.group{background:var(--surf);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;display:flex;flex-direction:column;gap:3px}
.row-main .t{font-weight:600;overflow-wrap:anywhere}
.row-main .t.done{text-decoration:line-through;color:var(--muted);font-weight:400}
.row-main .s{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
.tag{font-size:.74rem;padding:1px 7px;border-radius:6px;background:var(--surf2);color:var(--ink);font-weight:600}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.who{font-size:.76rem;font-weight:700}
.who.p1{color:var(--p1)}.who.p2{color:var(--p2)}.who.pa{color:var(--muted)}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surf);display:grid;place-items:center;padding:0}
.check.round{border-radius:50%}
.check.on{background:var(--pri);border-color:var(--pri)}
.check.on::after{content:'';width:11px;height:6px;border:2.5px solid var(--pri-ink);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.qty{display:flex;align-items:center;flex:none}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);font-size:1.1rem;line-height:1;padding:0}
.qty span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:.88rem}
.mini{flex:none;font-size:.78rem;font-weight:600;border:1px solid currentColor;color:var(--warn);background:none;border-radius:8px;padding:5px 8px}
.empty{color:var(--muted);padding:14px;font-size:.92rem;margin:0}
.calm{background:var(--surf);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);margin:0}
.amount{font-weight:700;font-variant-numeric:tabular-nums;flex:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:100px}
.tile .e{font-size:1.7rem;line-height:1}
.tile .n{font-weight:700;margin-top:8px}
.tile .c{font-size:.78rem;color:var(--muted)}
.tile .al{color:var(--bad);font-weight:600}
.linkrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:8px;text-align:left}
.linkrow b{font-variant-numeric:tabular-nums}

.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:4px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--surf);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.quick{display:flex;gap:8px;margin:4px 0}
.quick input{flex:1}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--pri);flex:none}
textarea{resize:vertical}
.pri{background:var(--pri);color:var(--pri-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
.ghost.bad{color:var(--bad);border-color:transparent;padding-left:4px}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(86px + env(safe-area-inset-bottom));background:var(--pri);color:var(--pri-ink);border:0;border-radius:16px;padding:13px 18px 13px 14px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(15,40,28,.28);z-index:6}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:7}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);padding:4px 0;border-radius:10px;min-width:0}
nav.tabs button.on{color:var(--pri);font-weight:700}

.modal{position:fixed;inset:0;background:rgba(8,18,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 14px;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.sheet h3{font-size:.98rem;margin:22px 0 8px}
.hint{color:var(--muted);font-size:.86rem;margin:-6px 0 12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);margin-bottom:12px}
label.f[hidden]{display:none}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:1rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.acts .sp{flex:1}
.finrow{display:grid;grid-template-columns:1fr 148px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.finrow label{display:flex;gap:10px;align-items:center}
.pasos{list-style:none;margin:0;padding:0}
.pasos li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pasos li span{flex:1}
.pasos .done{text-decoration:line-through;color:var(--muted)}
.pasos .x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:4px 8px}

.bar{height:8px;background:var(--surf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.over i{background:var(--bad)}
.proj{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:14px 12px;display:flex;flex-direction:column;gap:7px}
.group .proj:first-child{border-top:0}
.proj .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.proj .h b{font-size:1.02rem}
.proj .m{font-size:.8rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}

.month{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px}
.month b{font-size:1.05rem}
.total{font-size:2.6rem;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.05;font-variant-numeric:tabular-nums}
.total-l{color:var(--muted);margin:0 0 10px;font-size:.9rem}
.balance{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:6px 0}
.balance p{margin:0}
.balance .d{font-size:.8rem;color:var(--muted);margin-top:4px}
.cat{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:10px 12px;border-top:1px solid var(--line);font-size:.92rem}
.cat:first-child{border-top:0}
.cat .bar{grid-column:1/-1;height:6px}

.banner{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin:6px 0 4px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.92rem}
.list-esp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.list-esp:first-child{border-top:0}
.list-esp span{flex:1}
code.k{display:block;background:var(--surf2);padding:10px;border-radius:10px;font-size:.75rem;overflow-wrap:anywhere;user-select:all}


.bell{position:relative}
.bell[hidden]{display:none}
.bell-n{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#C2331B;color:#fff;font-size:.68rem;font-weight:800;line-height:18px;text-align:center;border:2px solid var(--bg)}
.bell-n[hidden]{display:none}
.notif{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-top:1px solid var(--line)}
.notif:first-child{border-top:0}
.notif .t{font-size:.94rem}
.notif .who{font-size:.94rem}
.notif .h{font-size:.76rem;color:var(--muted)}
.notif.nueva{background:var(--warn-bg)}
h3.cap::first-letter{text-transform:uppercase}
.row-main .por{font-size:.74rem;color:var(--muted)}
.semana{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 6px;display:flex;flex-direction:column;gap:8px}
.sem-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.92rem}
.sem-h span{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.sem-bar{display:flex;height:12px;border-radius:99px;background:var(--surf2);overflow:hidden;border:1px solid var(--line)}
.sem-bar i{display:block;height:100%}
.sem-bar i.ok,.sem-l i.ok{background:var(--pri)}
.sem-bar i.late,.sem-l i.late{background:var(--bad)}
.sem-l,.sem-p{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);align-items:center}
.sem-l i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--line);margin-right:5px;vertical-align:-1px}
.sem-p .r{margin-left:auto}
.sem-vacia{margin:0;color:var(--muted);font-size:.86rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;z-index:30;max-width:92vw;width:max-content;font-size:.9rem;display:flex;gap:14px;align-items:center}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:var(--bg);font-weight:800;text-decoration:underline;padding:0}

/* ===== Diseño "Refrigerador" ===== */
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.brand{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero{padding:4px 2px 14px}
.hero p{font-size:1rem}
.hero h1{font-size:clamp(2.2rem,10vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.imanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.iman{border:0;border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;box-shadow:0 5px 0 var(--sombra);transition:transform .15s}
.iman b{font-size:2.1rem;line-height:1;font-weight:700}
.iman span{font-size:.82rem;font-weight:500}
.iman.m1{background:var(--m1);color:var(--m1-ink);transform:rotate(-2deg)}
.iman.m2{background:var(--m2);color:var(--m2-ink);transform:rotate(1.5deg)}
.iman.m3{background:var(--m3);color:var(--m3-ink);transform:rotate(-1deg)}
.iman:active{transform:rotate(0) scale(.97)}
.group,.calm,.linkrow,.semana,.balance{border:0;border-radius:22px}
.calm{border:2px dashed var(--line);background:transparent}
.row{border-top:1.5px dashed var(--line);padding:8px 14px}
.notif{border-top:1.5px dashed var(--line)}
.check{border-radius:50%;border-width:2.5px;width:30px;height:30px}
.tag{border-radius:999px;padding:2px 9px;font-weight:600}
.qty button{border-radius:50%;border:0;background:var(--surf2)}
.mini{border-radius:999px}
.chip{border:0;font-weight:500}
.chip.on{background:var(--pri);color:var(--pri-ink)}
.seg{border:0;border-radius:999px;padding:4px}
.seg button{border-radius:999px}
input,select,textarea{border-radius:14px;border-width:1.5px}
.pri,.ghost{border-radius:14px}
.fab{border-radius:999px;bottom:calc(96px + env(safe-area-inset-bottom));box-shadow:0 5px 0 var(--sombra)}
.sheet{border-radius:28px 28px 0 0}
.sem-bar{border:0;height:14px}
h2.sec{font-size:1.15rem}
.tiles{gap:10px}
.tile{border:0;border-radius:22px;padding:14px;gap:2px;min-height:118px;color:var(--ink)}
.tile .e{width:42px;height:42px;border-radius:14px;background:var(--surf);display:grid;place-items:center;font-size:1.35rem}
.tile .n{font-size:1.06rem;margin-top:8px}
.tile .c{color:var(--ink);opacity:.75}
.tile .al{color:var(--bad);opacity:1}
.tile.t0{background:var(--t0)}.tile.t1{background:var(--t1)}.tile.t2{background:var(--t2)}.tile.t3{background:var(--t3)}
.tile.t4{background:var(--t4)}.tile.t5{background:var(--t5)}.tile.t6{background:var(--t6)}.tile.t7{background:var(--t7)}
nav.tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));border:0;border-radius:28px;padding:8px 6px;box-shadow:0 8px 24px rgba(20,16,50,.18);max-width:520px;margin:0 auto}
nav.tabs .in{justify-content:space-around}
nav.tabs button{flex:none;width:48px;height:48px;border-radius:50%;justify-content:center;padding:0}
nav.tabs button.on{background:var(--pri);color:var(--pri-ink)}
nav.tabs button .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#toast{bottom:calc(170px + env(safe-area-inset-bottom));border-radius:16px}

/* ===== v0.2: gastos ===== */
label.f.sw{position:relative;flex-direction:row;align-items:center;justify-content:space-between;gap:14px;background:var(--surf);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);font-size:1rem}
.sw-t{display:flex;flex-direction:column;gap:2px}
.sw-t small{font-size:.8rem;color:var(--muted)}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-k{flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw-k::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+.sw-k{background:var(--pri)}
.sw input:checked+.sw-k::after{transform:translateX(22px)}
.sw input:focus-visible+.sw-k{outline:2px solid var(--pri);outline-offset:2px}
.mini-ayuda{font-size:.8rem;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--pri);font-weight:600;text-decoration:underline;font-size:inherit}
.prov,.list-esp small.prov{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.n.rojo,.rojo{color:var(--bad)}
.n.verde,.verde{color:var(--ok)}
